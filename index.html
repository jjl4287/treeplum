    // SCROLL PHASE MANAGER
    // ══════════════════════════════════════════════════════════════════════════
    class ScrollPhaseManager {
      constructor() {
        this.phases = [
          { name: 'awakening', start: 0, end: 0.1, colors: ['#0a0908', '#1a1410'] },
          { name: 'roots', start: 0.1, end: 0.2, colors: ['#1a1410', '#2d1810'] },
          { name: 'growth', start: 0.2, end: 0.35, colors: ['#2d1810', '#1a3a2a'] },
          { name: 'bloom', start: 0.35, end: 0.5, colors: ['#1a3a2a', '#4a1942'] },
          { name: 'peak-chaos', start: 0.5, end: 0.65, colors: ['#4a1942', '#7b2d5b'] },
          { name: 'fruit', start: 0.65, end: 0.8, colors: ['#7b2d5b', '#5c2154'] },
          { name: 'descent', start: 0.8, end: 0.9, colors: ['#5c2154', '#2a1a2d'] },
          { name: 'return', start: 0.9, end: 1, colors: ['#2a1a2d', '#0a0908'] }
        ];
        
        this.currentPhase = null;
        this.overlay = document.createElement('div');
        this.overlay.id = 'phase-overlay';
        this.overlay.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:0;transition:background 0.5s ease;';
        document.body.insertBefore(this.overlay, document.body.firstChild);
      }
      
      update(progress) {
        let currentPhase = this.phases[0];
        
        for (const phase of this.phases) {
          if (progress >= phase.start && progress < phase.end) {
            currentPhase = phase;
            break;
          }
        }
        
        if (progress >= this.phases[this.phases.length - 1].start) {
          currentPhase = this.phases[this.phases.length - 1];
        }
        
        // Interpolate colors within phase
        const phaseProgress = (progress - currentPhase.start) / (currentPhase.end - currentPhase.start);
        
        this.overlay.style.background = `linear-gradient(180deg, 
          ${currentPhase.colors[0]} 0%, 
          ${this.lerpColor(currentPhase.colors[0], currentPhase.colors[1], phaseProgress)} 50%,
          ${currentPhase.colors[1]} 100%
        )`;
        
        this.currentPhase = currentPhase;
        return currentPhase;
      }
      
      lerpColor(color1, color2, t) {
        const c1 = this.hexToRgb(color1);
        const c2 = this.hexToRgb(color2);
        
        const r = Math.round(c1.r + (c2.r - c1.r) * t);
        const g = Math.round(c1.g + (c2.g - c1.g) * t);
        const b = Math.round(c1.b + (c2.b - c1.b) * t);
        
        return `rgb(${r}, ${g}, ${b})`;
      }
      
      hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
          r: parseInt(result[1], 16),
          g: parseInt(result[2], 16),
          b: parseInt(result[3], 16)
        } : { r: 0, g: 0, b: 0 };
      }
    }
    
    // ══════════════════════════════════════════════════════════════════════════
    // CHAOS BURST SYSTEM (for peak chaos section)
    // ══════════════════════════════════════════════════════════════════════════
    class ChaosBurst {
      constructor() {
        this.canvas = document.createElement('canvas');
        this.canvas.id = 'chaos-canvas';
        this.canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:6;mix-blend-mode:screen;';
        document.body.appendChild(this.canvas);
        this.ctx = this.canvas.getContext('2d');
        this.bursts = [];
        this.resize();
      }
      
      resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = state.viewportWidth * dpr;
        this.canvas.height = state.viewportHeight * dpr;
        this.ctx.scale(dpr, dpr);
      }
      
      addBurst(x, y) {
        const numParticles = 30 + Math.random() * 20;
        for (let i = 0; i < numParticles; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 8;
          const hue = 300 + Math.random() * 60;
          
          this.bursts.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3 + Math.random() * 6,
            life: 1,
            decay: 0.015 + Math.random() * 0.01,
            hue,
            type: Math.random() > 0.5 ? 'petal' : 'spark'
          });
        }
      }
      
      update() {
        this.bursts = this.bursts.filter(b => {
          b.x += b.vx;
          b.y += b.vy;
          b.vy += 0.1; // gravity
          b.vx *= 0.99;
          b.life -= b.decay;
          b.size *= 0.98;
          return b.life > 0;
        });
      }
      
      draw(scrollProgress) {
        this.ctx.clearRect(0, 0, state.viewportWidth, state.viewportHeight);
        
        // Auto-spawn during peak chaos
        if (scrollProgress > 0.45 && scrollProgress < 0.7) {
          if (Math.random() < 0.03) {
            this.addBurst(
              Math.random() * state.viewportWidth,
              Math.random() * state.viewportHeight
            );
          }
        }
        
        this.bursts.forEach(b => {
          this.ctx.save();
          this.ctx.translate(b.x, b.y);
          this.ctx.globalAlpha = b.life;
          
          if (b.type === 'petal') {
            const gradient = this.ctx.createRadialGradient(0, 0, 0, 0, 0, b.size);
            gradient.addColorStop(0, `hsla(${b.hue}, 80%, 80%, 1)`);
            gradient.addColorStop(1, `hsla(${b.hue}, 80%, 60%, 0)`);
            
            this.ctx.beginPath();
            this.ctx.ellipse(0, 0, b.size * 0.6, b.size, b.life * 10, 0, Math.PI * 2);
            this.ctx.fillStyle = gradient;
            this.ctx.fill();
          } else {
            this.ctx.beginPath();
            this.ctx.arc(0, 0, b.size * 0.5, 0, Math.PI * 2);
            this.ctx.fillStyle = `hsla(${b.hue}, 100%, 70%, 1)`;
            this.ctx.shadowColor = `hsla(${b.hue}, 100%, 70%, 0.8)`;
            this.ctx.shadowBlur = 10;
            this.ctx.fill();
          }
          
          this.ctx.restore();
        });
      }
    }
    
    // ══════════════════════════════════════════════════════════════════════════
    // ENHANCED FLUIDITY APP
    // ══════════════════════════════════════════════════════════════════════════
    class FluidityAppEnhanced extends FluidityApp {
      constructor() {
        super();
        this.vines = new VineSystem();
        this.water = new WaterStream();
        this.phases = new ScrollPhaseManager();
        this.chaos = new ChaosBurst();
      }
      
      async init() {
        this.bindEvents();
        this.particles.init();
        this.scene.init();
        this.vines.init();
        this.water.init();
        
        // Audio gate
        this.audioGate.addEventListener('click', async () => {
          await audio.init();
          this.audioGate.classList.add('hidden');
          setTimeout(() => {
            this.audioGate.style.display = 'none';
          }, 1500);
        });
        
        this.isRunning = true;
        this.animate(0);
      }
      
      bindEvents() {
        super.bindEvents();
        
        // Enhanced touch - trigger chaos bursts
        window.addEventListener('touchstart', (e) => {
          Array.from(e.touches).forEach(touch => {
            if (state.scrollProgress > 0.4 && state.scrollProgress < 0.75) {
              this.chaos.addBurst(touch.clientX, touch.clientY);
            }
          });
        }, { passive: true });
        
        // Mouse fallback for desktop (skip if touch event just fired)
        window.addEventListener('click', (e) => {
          if (state.touchedRecently) return;
          if (state.scrollProgress > 0.4 && state.scrollProgress < 0.75) {
            this.chaos.addBurst(e.clientX, e.clientY);
          }
        });
        
        // Resize handlers for new systems
        window.addEventListener('resize', () => {
          this.water.resize();
          this.chaos.resize();
        });
      }
      
      animate(timestamp) {
        if (!this.isRunning) return;
        
        const deltaTime = timestamp - this.lastTime;
        this.lastTime = timestamp;
        state.time = timestamp;
        
        // Update phase
        const currentPhase = this.phases.update(state.scrollProgress);
        
        // Update all systems
        this.fluid.draw();
        this.particles.update();
        this.particles.draw();
        this.interactions.update();
        this.interactions.draw();
        this.scene.updateParallax(state.scrollProgress, state.deviceOrientation);
        this.vines.update(state.scrollProgress);
        this.water.update(state.scrollProgress, state.deviceOrientation);
        this.water.draw(state.scrollProgress);
        this.chaos.update();
        this.chaos.draw(state.scrollProgress);
        
        requestAnimationFrame((t) => this.animate(t));
      }
    }
    
    // ══════════════════════════════════════════════════════════════════════════
    // INITIALIZE ENHANCED APP
    // ══════════════════════════════════════════════════════════════════════════
    const app = new FluidityAppEnhanced();
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => app.init());
    } else {
      app.init();
    }
  </script>
</body>
